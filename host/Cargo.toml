[package]
name = "nirender-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A 64-bit renderer for the render link stream of the nirender plugin, on wgpu"

# The renderer is a library, so that another program can have it as a part: the helper of
# MGE XE. `nirender-host` is the renderer as a program of its own.
[lib]
name = "nirender_wgpu"
path = "src/lib.rs"

[[bin]]
name = "nirender-host"
path = "src/main.rs"

# This crate is not a part of the plugin crate above it.
[workspace]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# The debug overlay: the text and the graph are egui's, drawn by its wgpu renderer. No input.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.36", default-features = false }
jpeg-encoder = "0.7.1"
png = "0.18"
pollster = "0.3"
wgpu = { version = "30", features = ["static-dxc"] }
winit = "0.30"

[profile.dev]
opt-level = 1
