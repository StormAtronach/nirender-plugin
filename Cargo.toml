[package]
name = "nirender"
version = "0.2.12"
edition = "2021"
license = "MIT"
description = "Rust replica of the NiDX8Renderer subsystem of Morrowind.exe, with 1:1 tests against the game code"

[lib]
# The file is akulakhan.dll (the owner's name for the plugin, 2026-10-17); the package keeps
# its name, and so do the Lua table and the environment variables.
name = "akulakhan"
crate-type = ["cdylib", "rlib"]

[features]
# The comparison rig: the mode shadow (the Rust and the engine function run both and are
# compared call by call), the frame comparison, the dumps, the frame times, the census of the
# device's callers and the allocator hooks. It needs a real Direct3D 8 device: a test run,
# never a player's build. `cargo build --release --features rig`.
rig = []

[profile.release]
opt-level = 2
debug = 1
panic = "abort"
